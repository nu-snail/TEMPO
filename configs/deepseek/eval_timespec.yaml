# DeepSeek-V3.1: Condition 3 — TimeSPEC Agent (inference-time leakage blocking)
# Uses the 5-phase agent pipeline: Generator → Supervisor → Regenerator → Supervisor2 → Aggregator
# NOTE: TimeSPEC requires tool-calling, so we use the instruct variant via OpenRouter
#       (not Tinker base model). OpenRouter model: deepseek/deepseek-chat-v3.1
# Override task via CLI: --tasks stock

model_name: "deepseek/deepseek-chat-v3.1"
use_tinker: false
tinker_checkpoint: ""
lora_rank: 32
prompt_mode: "temporal_hint"
use_timespec: true

temperature: 0.0
max_tokens: 4096

detector_model: "google/gemini-2.5-flash"
use_search: true
use_llm_judge: true
search_cache_path: "results/deepseek/eval_timespec/search_cache.json"

shapley_model: "google/gemini-2.5-flash"
shapley_max_samples: 100
shapley_batch_size: 32

output_dir: "results/deepseek/eval_timespec"
tasks: "stock,salary,legal"
