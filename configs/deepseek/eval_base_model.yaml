# DeepSeek-V3.1-Base: Condition 1 — Base Model (no temporal hint)
# Override task via CLI: --tasks stock

model_name: "deepseek-ai/DeepSeek-V3.1-Base"
use_tinker: true
tinker_checkpoint: ""
lora_rank: 32
prompt_mode: "base"

temperature: 0.0
max_tokens: 4096

detector_model: "google/gemini-2.5-flash"
use_search: true
use_llm_judge: true
search_cache_path: "results/deepseek/eval_base_model/search_cache.json"

shapley_model: "google/gemini-2.5-flash"
shapley_max_samples: 100
shapley_batch_size: 32

output_dir: "results/deepseek/eval_base_model"
tasks: "stock,salary,legal"
