[project]
name = "tempo"
version = "1.0.0"
description = "TEMPO: Temporal Enforcement via Mode-Separated Policy Optimization for Trustworthy LLM Backtesting (NeurIPS 2026)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "openai>=2.21.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "scipy>=1.12.0",
    "tinker>=0.23.0",
    "tinker-cookbook",
    "torch>=2.3.0",
]

[project.optional-dependencies]
data = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "pdfplumber>=0.11.0",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gated_experiment"]
