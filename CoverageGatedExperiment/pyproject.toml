[project]
name = "cov-gated-experiment"
version = "0.1.0"
description = "Independent GRPO experiment implementation for temporal leakage prevention"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.0.0",
    "openai>=2.21.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.12.0",
    "tinker>=0.19.0",
    "tinker-cookbook",
    "torch>=2.3.0",
]

[tool.uv.sources]
tinker-cookbook = { path = "../../tinker-cookbook", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

